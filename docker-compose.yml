version: '3.8'
services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  campusflow:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/campusflow
      - JWT_SECRET=your-production-jwt-secret-at-least-32-characters-long
      - ADMIN_EMAIL=admin@campusflow.local
      - ADMIN_PASSWORD=your-admin-password
      - ADMIN_NAME=School Admin
      - CLIENT_ORIGIN=http://localhost:5000
    volumes:
      - uploads:/app/server/uploads
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data:
  uploads: