services:
  - type: web
    name: campusflow-api
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@campusflow.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: School Admin
      - key: CLIENT_ORIGIN
        value: https://campusflow-client.onrender.com

  - type: web
    name: campusflow-client
    env: static
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://campusflow-api.onrender.com/api/*